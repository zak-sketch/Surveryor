<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In | Polar Surveyors Ltd</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com">
    </script>

    <!-- Modern sans‑serif font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f2b46 0%, #1e3a5f 50%, #0b1f33 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 1.5rem;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(59, 130, 246, 0.25);
            border-radius: 2rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 30px rgba(59, 130, 246, 0.15);
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .input-field {
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid rgba(59, 130, 246, 0.4);
            color: white;
            transition: all 0.3s ease;
        }

        .input-field:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.25), 0 0 15px rgba(59, 130, 246, 0.3);
        }

        .btn-login {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.4);
        }

        .btn-login:hover {
            background: linear-gradient(135deg, #1d4ed8, #1e40af);
            box-shadow: 0 8px 25px rgba(37, 99, 235, 0.6);
            transform: translateY(-1px);
        }

        .brand-glow {
            text-shadow: 0 0 10px rgba(59, 130, 246, 0.7);
        }
    </style>
</head>
<body>
    <div class="login-card w-full max-w-md p-8 md:p-10">
        <!-- Logo / Branding -->
        <div class="text-center mb-8">
            <div class="flex justify-center mb-4">
                <img src="logo.jpg" alt="Polar Surveyors Logo" class="h-16 w-auto rounded-lg shadow-md border border-white/20"
                     onerror="this.onerror=null; this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2280%22 height=%2280%22%3E%3Crect width=%2280%22 height=%2280%22 fill=%22%230f2b46%22/%3E%3Ctext x=%2250%25%22 y=%2255%25%22 dominant-baseline=%22middle%22 text-anchor=%22middle%22 fill=%22white%22 font-size=%2216%22 font-family=%22sans-serif%22%3EPolar%3C/text%3E%3C/svg%3E';">
            </div>
            <h1 class="text-3xl font-bold text-white brand-glow">
                Log In
            </h1>
            <p class="text-blue-200 text-sm mt-2">
                Polar Surveyors Ltd – Secure Access Portal
            </p>
        </div>

        <!-- Login Form -->
        <form class="space-y-6">
            <!-- Username -->
            <div>
                <label for="username" class="block text-blue-300 text-sm font-medium mb-2">
                    Username
                </label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter your username"
                    class="w-full px-4 py-3 rounded-xl input-field text-sm placeholder-blue-300/50"
                    required
                >
            </div>

            <!-- Password -->
            <div>
                <label for="password" class="block text-blue-300 text-sm font-medium mb-2">
                    Password
                </label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    class="w-full px-4 py-3 rounded-xl input-field text-sm placeholder-blue-300/50"
                    required
                >
            </div>

            <!-- Remember & Forgot -->
            <div class="flex items-center justify-between text-sm">
                <label class="flex items-center gap-2 text-blue-200 cursor-pointer">
                    <input type="checkbox" class="rounded border-blue-400 bg-transparent accent-blue-500">
                    Remember me
                </label>
                <a href="#" class="text-blue-300 hover:text-white transition">
                    Forgot password?
                </a>
            </div>

            <!-- Submit Button -->
            <button
                type="submit"
                class="w-full py-3.5 rounded-xl font-semibold text-white text-base btn-login"
            >
                Access System
            </button>
        </form>

        <!-- Footer (no Robotech branding) -->
        <div class="mt-8 border-t border-blue-900/50 pt-6 text-center">
            <p class="text-blue-300/60 text-xs">
                &copy; <span id="year"></span> Polar Surveyors Ltd. All rights reserved.
            </p>
            <p class="text-blue-300/40 text-xs mt-1">
                Kitengela · Family Bank Betty Centre
            </p>
        </div>
    </div>

    <script>
        // Set current year
        document.getElementById('year').textContent = new Date().getFullYear();
    </script>
</body>
</html>
